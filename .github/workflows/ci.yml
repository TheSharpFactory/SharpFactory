name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SF.slnx -c Release

      - name: Engine tests
        run: dotnet test Tests/SF.Tests/SF.Tests.csproj -c Release --no-build

      - name: UI tests (headless)
        run: dotnet test Tests/SF.App.Tests/SF.App.Tests.csproj -c Release --no-build

      # every OS must generate the same bytes: hash every generated file, compared in the next job
      - name: Generate the public test model
        run: dotnet run --project App/SF.Cli -c Release --no-build -- generate Tests/SF.Tests/Fixtures/Coverage.edmj "${{ runner.temp }}/generated"

      - name: Hash the generated files
        run: |
          $root = "${{ runner.temp }}/generated"
          $lines = foreach ($file in Get-ChildItem -Path $root -Recurse -File -Filter *.cs) {
            $relative = [System.IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            "$relative $((Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash)"
          }
          [System.Array]::Sort($lines, [System.StringComparer]::Ordinal)
          # LF between lines on every OS, so the files compare byte for byte
          Set-Content -Path "${{ runner.temp }}/hashes-${{ matrix.os }}.txt" -Value (($lines -join "`n") + "`n") -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: ${{ runner.temp }}/hashes-${{ matrix.os }}.txt

  same-output-everywhere:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true

      - name: Compare the generated files across Windows, Linux and macOS
        run: |
          diff hashes-windows-latest.txt hashes-ubuntu-latest.txt
          diff hashes-windows-latest.txt hashes-macos-latest.txt
          echo "$(wc -l < hashes-windows-latest.txt) generated files are byte-identical on all three"
