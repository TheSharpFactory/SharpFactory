name: CI macOS

# The build and every test on macOS, apart from CI (ci.yml) and its badge: GitHub's macOS runners are often all busy,
# and a run that gets none is cancelled after about 15 minutes. Re-run it from the Actions tab when that happens.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SF.slnx -c Release

      - name: Engine tests
        run: dotnet test Tests/SF.Tests/SF.Tests.csproj -c Release --no-build

      - name: C# writer tests
        run: dotnet test Tests/SF.CSharpWriter.Tests/SF.CSharpWriter.Tests.csproj -c Release --no-build

      - name: UI tests (headless)
        run: dotnet test Tests/SF.App.Tests/SF.App.Tests.csproj -c Release --no-build

      - name: Generate the public test model
        run: dotnet run --project App/SF.Cli -c Release --no-build -- generate Tests/SF.Tests/Fixtures/Coverage.edmj "${{ runner.temp }}/generated"
